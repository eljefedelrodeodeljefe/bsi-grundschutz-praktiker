name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (leave blank to auto-detect from commits)
        required: false
        type: choice
        options: ["", "patch", "minor", "major"]

jobs:
  release:
    name: Bump version & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          if [ -n "${{ github.event.inputs.increment }}" ]; then
            uv run cz bump --increment "${{ github.event.inputs.increment }}" --yes
          else
            uv run cz bump --yes
          fi

      - name: Push tag & updated files
        run: git push --follow-tags

      - name: Read new version
        id: version
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-from-tag \
            --verify-tag
